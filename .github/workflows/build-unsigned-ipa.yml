name: Build Unsigned iOS IPA (sideload)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Build flavor (canary, beta, stable)"
        required: true
        default: "canary"
        type: choice
        options:
          - canary
          - beta
          - stable

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable

      - name: Strip Firebase dependencies if present
        run: dart run tool/strip_firebase_deps.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --flavor ${{ github.event.inputs.environment }} \
            --dart-define-from-file=tool/dart_defines/${{ github.event.inputs.environment }}.json \
            --dart-define=PUSH_PROVIDER=apns

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r "fluxer-${{ github.event.inputs.environment }}-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-${{ github.event.inputs.environment }}-unsigned-ipa
          path: build/ios/iphoneos/fluxer-${{ github.event.inputs.environment }}-unsigned.ipa
          retention-days: 14
